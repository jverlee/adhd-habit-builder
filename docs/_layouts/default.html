<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    {% seo title=false %}

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            },
            colors: {
              brand: {
                50:  '#eef6ff',
                100: '#d9eaff',
                200: '#bcdcff',
                300: '#8ec6ff',
                400: '#58a6ff',
                500: '#2f86f7',
                600: '#1f68db',
                700: '#1c54b0',
                800: '#1d488c',
                900: '#1d3e72',
              },
            },
            boxShadow: {
              soft: '0 10px 40px -10px rgba(31, 104, 219, 0.25)',
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      .bg-grid {
        background-image:
          radial-gradient(circle at 1px 1px, rgba(31, 104, 219, 0.08) 1px, transparent 0);
        background-size: 24px 24px;
      }
      .hero-blob {
        background: radial-gradient(60% 60% at 50% 40%, rgba(47, 134, 247, 0.35) 0%, rgba(47, 134, 247, 0) 70%);
      }
      .hero-image-mask {
        aspect-ratio: 678 / 456;
        overflow: hidden;
        border-top-left-radius: 1.5rem;
        border-top-right-radius: 1.5rem;
        filter: drop-shadow(0 30px 60px rgba(31, 104, 219, 0.25));
      }
      .hero-image-mask img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <header class="sticky top-0 z-30 backdrop-blur bg-white/70 border-b border-slate-200/60">
      <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-2 font-semibold text-slate-900">
          <span class="inline-flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 text-white shadow-soft">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </span>
          <span>Habi</span>
        </a>
        <nav class="hidden sm:flex items-center gap-6 text-sm text-slate-600">
          <a href="{{ '/#features' | relative_url }}" class="hover:text-slate-900 transition">Features</a>
          <a href="{{ '/#privacy' | relative_url }}" class="hover:text-slate-900 transition">Privacy</a>
          <a href="{{ '/support/' | relative_url }}" class="hover:text-slate-900 transition">Support</a>
          <a href="{{ '/privacy/' | relative_url }}" class="hover:text-slate-900 transition">Policy</a>
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="border-t border-slate-200 bg-white">
      <div class="max-w-6xl mx-auto px-6 py-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 text-sm text-slate-500">
        <div class="flex items-center gap-2">
          <span class="inline-flex h-6 w-6 items-center justify-center rounded-md bg-gradient-to-br from-brand-400 to-brand-600 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </span>
          <span>© {{ 'now' | date: '%Y' }} Habi · Habit builder for kids with ADHD. Built for families.</span>
        </div>
        <div class="flex items-center gap-5">
          <a href="{{ '/support/' | relative_url }}" class="hover:text-slate-900 transition">Support</a>
          <a href="{{ '/privacy/' | relative_url }}" class="hover:text-slate-900 transition">Privacy Policy</a>
        </div>
      </div>
    </footer>
  </body>
</html>
