title: ADHD Habit Builder
description: A calm, visual routine board for kids with ADHD. iPad and iPhone, fully offline.
url: ""
baseurl: ""

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Don't try to render Xcode / app files even if someone points Jekyll at the root.
exclude:
  - ADHDHabitBuilder
  - ADHDHabitBuilder.xcodeproj
  - .context
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Default layout for any page that doesn't specify one.
defaults:
  - scope:
      path: ""
    values:
      layout: page
