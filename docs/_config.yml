title: ADHD Habit Builder
description: A calm, visual routine board for kids with ADHD. iPad and iPhone, fully offline.
url: ""
baseurl: ""

remote_theme: pages-themes/cayman@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Don't try to render Xcode / app files even if someone points Jekyll at the root.
exclude:
  - ADHDHabitBuilder
  - ADHDHabitBuilder.xcodeproj
  - .context
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Show a clean nav by hiding the index from the auto page list.
defaults:
  - scope:
      path: ""
    values:
      layout: default
